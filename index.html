<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f3f0" />
    <meta name="description" content="Operator console for Physical Data Engine workflows." />
    <title>Physical Data Engine — Operator Console</title>
    <script type="module" crossorigin src="/Data-Engine-Console/assets/index-BbT1lsvk.js"></script>
    <link rel="stylesheet" crossorigin href="/Data-Engine-Console/assets/index-BpEMk41p.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="mobile-menu" type="button" aria-label="Toggle navigation">Menu</button>
        <a class="brand" href="#setup" aria-label="Physical Data Engine home">
          <span class="brand-mark">PDE</span>
          <span>Physical Data Engine</span>
        </a>
        <div class="workflow-id">seed-demo-to-training-v1</div>
        <div class="topbar-spacer"></div>
        <span class="runtime-mode">UI ALPHA · STATIC RUNTIME</span>
        <a class="repo-link" href="https://github.com/KIM-JAKE/Data-Engine" target="_blank" rel="noreferrer">Repository</a>
      </header>

      <aside class="sidebar" aria-label="Product navigation">
        <div class="nav-section">BUILD</div>
        <a class="nav-item is-active" href="#setup" data-route="setup"><span>01</span>Setup</a>
        <a class="nav-item" href="#workflow" data-route="workflow"><span>02</span>Workflow</a>
        <a class="nav-item" href="#live" data-route="live"><span>03</span>Live run</a>
        <div class="nav-section">OPERATE</div>
        <a class="nav-item" href="#runs" data-route="runs"><span>04</span>Runs</a>
        <a class="nav-item" href="#datasets" data-route="datasets"><span>05</span>Datasets</a>
        <a class="nav-item" href="#filtering" data-route="filtering"><span>06</span>Filtering</a>
        <a class="nav-item" href="#releases" data-route="releases"><span>07</span>Releases</a>
        <div class="nav-section">DEFINITIONS</div>
        <a class="nav-item" href="#modules" data-route="modules"><span>08</span>Modules</a>

        <div class="sidebar-foot">
          <span class="health-dot"></span>
          <div><strong>Contract registry</strong><small>5 modules · 2 adapters ready</small></div>
        </div>
      </aside>

      <main class="main-area" id="main-content" tabindex="-1">
        <div class="loading-state">Loading Data Engine definitions…</div>
      </main>
    </div>
    <div class="toast" role="status" aria-live="polite"></div>
    <script>
      window.__PDE_ERRORS = [];
      window.addEventListener('error', (event) => window.__PDE_ERRORS.push(event.message));
      window.addEventListener('unhandledrejection', (event) => window.__PDE_ERRORS.push(String(event.reason)));
    </script>
  </body>
</html>
